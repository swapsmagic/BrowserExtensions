<!DOCTYPE html>
<html>
<head>
  <title>YouTube Transcript</title>
  <style>
    body { font-family: Arial, sans-serif; width: 250px; padding: 10px; text-align: center; }
    button { width: 100%; padding: 10px; margin-top: 5px; }
    #statusMessage { margin-top: 10px; padding: 5px; border-radius: 3px; font-size: 0.9em; }
    .status-success { background-color: #e0ffe0; color: #006400; border: 1px solid #90ee90; }
    .status-error { background-color: #ffe0e0; color: #a00000; border: 1px solid #ffb6c1; }
    .status-info { background-color: #e0e8ff; color: #000080; border: 1px solid #add8e6; }
  </style>
</head>
<body>
  <h3>Transcript Fetcher</h3>
  <button id="fetchAndDisplayTranscript">Show Transcript on Page</button>
  <div id="statusMessage"></div>
  <script src="popup.js"></script>
</body>
</html>
